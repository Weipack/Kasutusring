<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Kasutusring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style id="css">
/* Layout: sticky bar with search and ET/RU switch, shop intro with slogan and delivery strip, category chips, product grid with price tags, prep steps, grades, delivery price list */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunken:#E2E7EC; --ink:#14202A; --muted:#566574; --line:#D2D9E0;
  --accent:#DF540D; --accent-ink:#FFFFFF; --ok:#1C7A4B; --warn:#9E5E00; --sold:#8995A1; --danger:#BE3328;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1216; --surface:#161D23; --sunken:#1F2830; --ink:#E3E9EE; --muted:#93A1AE; --line:#2B3640;
  --accent:#FF7533; --accent-ink:#1B0C03; --ok:#4FC38B; --warn:#E3A44A; --sold:#5E6B77; --danger:#FF6A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1216; --surface:#161D23; --sunken:#1F2830; --ink:#E3E9EE; --muted:#93A1AE; --line:#2B3640;
  --accent:#FF7533; --accent-ink:#1B0C03; --ok:#4FC38B; --warn:#E3A44A; --sold:#5E6B77; --danger:#FF6A5C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
body.has-save{padding-bottom:84px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap;min-width:0}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none;color:var(--accent)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sunken);border:1px solid transparent;border-radius:999px;padding:0 14px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:9px 0;outline:none}
@media (max-width:560px){.bar-in{flex-wrap:wrap}.brand{flex:1}.search{order:3;flex-basis:100%}}

.intro{padding-block:34px 18px;display:grid;gap:12px}
.intro h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5.4vw,50px);line-height:1.04;letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.tagline{color:var(--muted);max-width:60ch;margin:0;font-size:17px}
.meta{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.contacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.contact{display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink);text-decoration:none;font-size:14px}
.contact.has-btn{padding-right:6px}
a.contact:hover{border-color:var(--accent)}
.contact small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.contact .val{overflow-wrap:anywhere;min-width:0}
.hint{margin:0;font-size:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;max-width:60ch}

.owner{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));margin-bottom:14px}
.owner-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.owner-note{margin:0;font-size:13px;color:var(--muted)}
.meter{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pending{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:6px 14px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 320px;min-width:0;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.6;margin-left:6px}
.ctrl{display:flex;gap:12px;align-items:center;margin-left:auto}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer;white-space:nowrap}
.tog input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.ctrl select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.count{font-size:13px;color:var(--muted);margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px;padding-block:12px 44px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease}
.card:hover{border-color:var(--muted);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--sunken);display:grid;place-items:center;color:var(--muted)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph svg{width:36%;height:auto}
.cond{position:absolute;left:8px;top:8px;font-size:11.5px;font-weight:600;background:var(--surface);color:var(--ink);padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.ex{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:3px 6px;border-radius:4px}
.editmark{position:absolute;right:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.sku{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-size:15.5px;font-weight:600;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.specs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-row{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.tag{position:relative;display:inline-flex;align-items:center;font-family:var(--mono);font-weight:600;font-size:16px;line-height:1.3;background:var(--accent);color:var(--accent-ink);padding:3px 10px 3px 19px;border-radius:2px 6px 6px 2px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
.old{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{margin-left:auto;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-in{color:var(--ok)}.st-reserved{color:var(--warn)}.st-sold{color:var(--sold)}
.card.sold .ph>*:not(.ex):not(.editmark){filter:grayscale(1);opacity:.55}
.card.sold .tag{background:var(--sold)}
.empty{grid-column:1/-1;display:grid;justify-items:start;gap:10px;padding:28px 0;color:var(--muted)}
.empty p{margin:0;font-size:16px}

.info{padding-block:40px;border-top:1px solid var(--line)}
.info-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:40px}
@media (max-width:820px){.info-grid{grid-template-columns:1fr;gap:30px}}
.info h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.lead{margin:0;color:var(--muted);font-size:14px}
.scale{list-style:none;padding:0;margin:16px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:700px){.scale{grid-template-columns:1fr 1fr}}
.scale li{display:grid;gap:3px;font-size:13px;color:var(--muted);align-content:start}
.scale b{color:var(--ink);font-size:14px;font-weight:600}
.lvl{display:flex;gap:3px;margin-bottom:5px}
.lvl i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--ink)}
.lvl.svc i{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px)}
.ticks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;font-size:14.5px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"✓";color:var(--accent);font-weight:700;flex:none}
.foot{padding-block:18px 40px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;line-height:1.2;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger-ghost{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.ghost-inv{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.mini{font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--muted)}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;width:min(940px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 30px 80px rgb(0 0 0 / .35);overflow:hidden}
dialog.narrow{width:min(640px,calc(100vw - 20px))}
dialog::backdrop{background:rgb(8 12 16 / .58)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 20px)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-family:var(--display);font-size:17px;font-weight:500;margin:0;flex:1}
.dlg-head .sku{flex:1}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.dlg-body{overflow:auto;min-height:0}
.dlg-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sp{flex:1}

.pv{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;padding:20px}
@media (max-width:760px){.pv{grid-template-columns:1fr;gap:18px;padding:16px}}
.gal-main{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--sunken);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.gal-main img{width:100%;height:100%;object-fit:contain}
.gal-main svg{width:38%;height:auto}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:60px;height:60px;padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--sunken);cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.pinfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.ptitle{font-family:var(--display);font-weight:500;font-size:clamp(20px,3vw,26px);line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.price-row.big{padding-top:0;margin-top:0}
.price-row.big .tag{font-size:22px;padding:5px 14px 5px 23px}
.price-row.big .tag::before{left:10px}
.price-row.big .st{margin-left:4px;font-size:13.5px}
.condbox{display:grid;gap:2px;font-size:14px;color:var(--muted);border-left:3px solid var(--ink);padding-left:10px}
.condbox b{color:var(--ink);font-weight:600}
.spec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);margin:0;font-size:14px}
.spec dt,.spec dd{margin:0;padding:7px 0;border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.spec dt{color:var(--muted);padding-right:12px}
.spec dd.full{grid-column:1/-1}
.desc{margin:0;font-size:15px;overflow-wrap:anywhere}
.exnote{margin:0;font-size:13px;background:var(--sunken);padding:8px 10px;border-radius:8px;color:var(--muted)}
.buy{background:var(--sunken);border-radius:12px;padding:16px;display:grid;gap:10px}
.buy h3{margin:0;font-size:15px;font-weight:600}
.buy p{margin:0;font-size:14px;color:var(--muted)}
.buy-btns{display:flex;flex-wrap:wrap;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px}
.msg .sel{flex:1;min-width:0;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}

.form{display:grid;gap:14px;padding:20px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.f{display:grid;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.f > span{font-weight:500}
.f small{font-weight:400;opacity:.85}
.form input[type="text"],.form input[type="number"],.form input[type="url"],.form input[type="email"],.form input[type="tel"],.form select,.form textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.form textarea{resize:vertical;line-height:1.45}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.legend{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px;border-top:1px solid var(--line);padding-top:14px}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.pt{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;background:var(--sunken)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt-act{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:center;padding:3px;background:linear-gradient(transparent,rgb(0 0 0 / .65))}
.pt-act button{width:26px;height:26px;border-radius:6px;border:0;background:rgb(255 255 255 / .94);color:#111;cursor:pointer;font-size:14px;line-height:1}
.cover{font-size:10px;color:#fff;padding-left:4px;font-weight:600}
.drop{position:relative;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);cursor:pointer;text-align:center;font-size:14px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.err{margin:0;color:var(--danger);font-size:14px;font-weight:500}

.eyebrow{margin:0;font-family:var(--mono);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.meta a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.cond.g-nd{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.fact{font-size:11.5px;line-height:1.5;padding:1px 7px;border-radius:4px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.fact.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.pinfo .fact{font-size:13px;padding:3px 9px}
.newp{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.savebox{margin:0;font-size:14px;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--ok) 11%,var(--surface))}
.condbox a{color:var(--muted);font-size:13px;text-underline-offset:3px}
.checkbox-list h3,.defects h3{margin:0 0 6px;font-size:14px;font-weight:600}
.checkbox-list .ticks{margin:0;gap:6px;font-size:14px}
.defects{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface));border-radius:8px;padding:10px 12px}
.defects p{margin:0;font-size:14px}
.checks-edit{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;margin:0}
.checks-edit legend{padding:0 4px;font-weight:500}
.checks-edit .tog{color:var(--ink)}
.steps-wrap{margin-bottom:36px}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14.5px}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;background:var(--ink);color:var(--bg)}
#grades{scroll-margin-top:90px}
#savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgb(0 0 0 / .18)}
.sb-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;width:max-content;max-width:calc(100vw - 32px);display:grid;gap:6px;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
body.has-save #toast{bottom:92px}
#toast input{font:inherit;font-size:13px;width:100%;padding:6px 8px;border-radius:6px;border:0;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;padding:5px 9px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.pricelist{display:grid;grid-template-columns:minmax(0,1fr) auto;margin:12px 0 0;font-size:14.5px}
.pricelist dt,.pricelist dd{margin:0;padding:8px 0;border-bottom:1px dashed var(--line)}
.pricelist dd{font-family:var(--mono);font-weight:600;text-align:right;padding-left:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

.svc-line{font-size:13px!important}

.bi{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.lc{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.trbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--sunken);font-size:13px;color:var(--muted)}
.svc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px 36px;gap:10px;align-items:end;margin-bottom:10px}

function visible(){
  var q = ui.q.trim().toLowerCase();
  var words = q ? q.split(/\s+/) : [];
  var list = state.products.filter(function(p){
    if (ui.cat!=='all' && catKey(p)!==ui.cat) return false;
    if (ui.stock && p.status==='sold') return false;
    if (words.length){
      var hay = [side(p.title,'et'),side(p.title,'ru'),side(p.cat,'et'),side(p.cat,'ru'),p.id,p.year,side(p.desc,'et'),side(p.desc,'ru'),
        sideList(p.specs,'et').concat(sideList(p.specs,'ru')).map(function(s){ return s.join(' '); }).join(' ')].join(' ').toLowerCase();
      return words.every(function(w){ return hay.indexOf(w)>=0; });
    }
    return true;
  });
  function rank(p){ return p.status==='sold' ? 1 : 0; }
  list.sort(function(a,b){
    return rank(a)-rank(b) || (ui.sort==='asc' ? a.price-b.price : ui.sort==='desc' ? b.price-a.price : b.id.localeCompare(a.id));
  });
  return list;
}

function sellerHTML(){

  if (c) parts.push(c);

function termsBody(){
  var out = [], list = null;
  function flush(){ if (list){ out.push('<ul>'+list.join('')+'</ul>'); list = null; } }
  tr(state.shop.terms).split('\n').forEach(function(raw){
    var l = raw.trim();
    if (!l){ flush(); return; }
    if (l === '{seller}'){ flush(); out.push(sellerHTML()); return; }
    if (l === '{services}'){ flush(); var sv = services(); if (sv.length) out.push('<dl class="pricelist">'+sv.map(function(x){ return '<dt>'+esc(tr(x))+'</dt><dd>'+esc(svcPrice(x))+'</dd>'; }).join('')+'</dl>'); return; }
    if (/^##\s+/.test(l)){ flush(); out.push('<h3>'+esc(l.replace(/^##\s+/,''))+'</h3>'); return; }
    if (/^[-•]\s+/.test(l)){ (list = list || []).push('<li>'+esc(l.replace(/^[-•]\s+/,''))+'</li>'); return; }
    flush(); out.push('<p>'+esc(l)+'</p>');
  });
  flush();
  return out.join('');
}

  if (location.hash !== '#terms') location.hash = 'terms';
}

      '<div class="msg"><span class="sel">'+esc(msg)+'</span><button type="button" class="mini" data-copy="'+esc(msg)+'" data-ok="'+esc(t('msgCopied'))+'">'+t('copy')+'</button></div>'+
      (others.length ? '<div class="contacts">'+others.map(contactChip).join('')+'</div>' : '')+
      (hasTerms() ? '<p class="svc-line">'+t('agree')+'<a href="#terms" data-act="terms">'+t('agreeLink')+'</a>.</p>' : '')+
      (services().length ? '<p class="svc-line">'+services().map(function(x){ return esc(tr(x))+': '+esc(svcPrice(x)); }).join(' · ')+'</p>' : '');

      '<h2 class="ptitle">'+esc(title)+'</h2>'+

        '<span class="st st-'+esc(p.status)+'">'+(t(p.status)||'')+(p.status==='in'&&p.qty>1?', '+p.qty+' '+t('qty'):'')+'</span></div>'+
      (sv ? '<p class="savebox">'+t('saveA')+'<b>'+money(p.newPrice)+'</b>'+t('saveB')+money(sv.diff)+' ('+sv.pct+'%).</p>' : '')+
      (p.example ? '<p class="exnote">'+t('example')+'</p>' : '')+

function openProduct(id){

}
function clearHash(){
  if (!/^#p-/.test(location.hash)) return;
  try { history.replaceState(null,'',location.pathname+location.search); } catch(e){ location.hash = ''; }
}
function route(){
  var h = location.hash, pd = $('#pd');
  var lm = h.match(/(?:^#|-)(et|ru)$/);
  if (lm && lm[1]!==lang){ setLang(lm[1], true); }
  var m = h.match(/^#p-([A-Za-z0-9]+?)(?:-(?:et|ru))?$/);
  if (m && find(m[1])){ if (!(pd.open && pd.dataset.id===m[1])) openProduct(m[1]); }
  else if (pd.open) pd.close();

function shrink(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var max = 1100, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max/Math.max(w,h));
      w = Math.max(1,Math.round(w*k)); h = Math.max(1,Math.round(h*k));
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      var x = cv.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.8));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function addFiles(files){
  var arr = Array.prototype.filter.call(files||[], function(f){ return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name); });
  if (!arr.length || !draft) return;
  var d = draft;
  busyPhotos += arr.length; renderPhotos();
  arr.reduce(function(chain,f){
    return chain.then(function(){ return shrink(f).then(function(u){ if (draft===d){ d.photos.push(u); } }, function(){ toast('Не удалось открыть «'+f.name+'». Подойдут JPG, PNG или WebP.'); }); })
      .then(function(){ busyPhotos--; if (draft===d) renderPhotos(); });
  }, Promise.resolve());
}

var TR_FIELDS = { ed:['f-title','f-cat','f-def','f-specs','f-desc'], sd:['s-kick','s-slogan','s-tag','s-steps','s-info','s-terms'] };
function autoTranslate(scope, btn){
  if (!samp){ toast('Перевод здесь недоступен. Заполните оба языка вручную'); return; }
  var items = [];
  var bases = TR_FIELDS[scope].slice();
  if (scope==='sd') Array.prototype.forEach.call(document.querySelectorAll('.svc-row'), function(r){ bases.push('svc'+r.dataset.i); });
  bases.forEach(function(base){
    var e = $('#'+base+'-et'), r = $('#'+base+'-ru'); if (!e || !r) return;
    var ev = e.value.trim(), rv = r.value.trim();
    if (ev && !rv) items.push({el:r, from:'Estonian', to:'Russian', text:e.value.trim()});
    else if (rv && !ev) items.push({el:e, from:'Russian', to:'Estonian', text:r.value.trim()});
  });
  if (!items.length){ toast('Нечего переводить: заполните поле на одном языке, а второе оставьте пустым'); return; }
  var prompt = 'You translate texts for the website of "'+(state.shop.name||'Kasutusring')+'", a shop in Estonia that sells used home appliances and tools. '+
    'Translate each item from its "from" language into its "to" language. Rules: keep brand names, model names, numbers and units unchanged (but write units the way the target language does, e.g. "см" in Russian, "cm" in Estonian); keep every line break; a line written as "Name: value" stays in that form; keep lines starting with "## " and the placeholders {seller} and {services} exactly as they are; use natural, concise shop wording; Estonian must be correct standard Estonian. '+
    'Reply with only a JSON array of the translated strings, one per item, in the same order.\n\n'+
    JSON.stringify(items.map(function(i){ return {from:i.from, to:i.to, text:i.text}; }));
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Перевожу…';
  samp.json(prompt, {modelTier:'default'}).then(function(arr){
    if (!Array.isArray(arr)) throw {code:'invalid_json'};
    var n = 0;
    items.forEach(function(it, i){ if (typeof arr[i]==='string' && arr[i].trim() && !it.el.value.trim()){ it.el.value = arr[i].trim(); n++; } });
    toast(n ? 'Готово. Проверьте перевод и сохраните' : 'Перевод пришёл пустым. Попробуйте ещё раз');
  }).catch(function(e){
    var c = e && e.code;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0){
      samp = null; toast('Перевод не разрешён. Заполните второй язык вручную');
      Array.prototype.forEach.call(document.querySelectorAll('.trbar'), function(b){ b.hidden = true; });
    }
    else if (c==='rate_limited') toast('Слишком много запросов. Попробуйте через минуту');
    else if (c==='cancelled') {}
    else toast('Не получилось перевести. Попробуйте ещё раз');
  }).then(function(){ btn.disabled = false; btn.textContent = old; });
}

  var css = $('#css').textContent, js = $('#app').textContent, fonts = $('#fonts').getAttribute('href');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>'+esc(s.shop.name||'Kasutusring')+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link id="fonts" rel="stylesheet" href="'+esc(fonts)+'">\n<style id="css">'+css+'</style>\n<div id="root"></div>\n'+
    '<'+SC+' type="application/json" id="store">'+safeJSON(s)+'</'+SC+'>\n<'+SC+' id="app">'+js+'</'+SC+'>\n</body></html>';
}
function markDirty(){ dirty = true; discardArmed = false; renderSavebar(); }

function publish(){
  if (saving) return;
  if (!art){ toast('Опубликовать можно только из Claude, где открыта витрина'); return; }
  var next = clone(state);
  next.rev = (STORE.rev||0)+1;
  next.updated = new Date().toISOString().slice(0,10);
  var html = buildDocument(next);
  if (html.length > 15.5*1048576){ toast('Витрина больше 16 МБ. Удалите часть фото и попробуйте снова'); return; }
  try { sessionStorage.setItem(PKEY, JSON.stringify(next)); } catch(e){}
  saving = true; renderSavebar();
  art.publish(html).then(function(){ toast('Опубликовано'); }, function(e){
    saving = false;
    var c = e && e.code;
    if (c==='conflict') toast('Витрина изменилась в другом окне. После обновления ваши правки можно будет восстановить');
    else if (['not_writer','not_granted','not_declared','capability_disabled','capability_removed','consent_required'].indexOf(c)>=0){
      canEdit = false; editing = false; toast('Эту витрину можно только просматривать'); renderAll();
    }
    else if (c==='too_large') toast('Витрина слишком большая. Удалите часть фото');
    else if (c==='rate_limited') toast('Слишком часто. Подождите минуту и опубликуйте снова');
    else toast('Не получилось опубликовать. Попробуйте ещё раз');
    renderSavebar();
  });
}

function loadPending(){
  var raw = null;
  try { raw = sessionStorage.getItem(PKEY); } catch(e){}
  if (!raw) return;
  try {
    var p = JSON.parse(raw);
    if (JSON.stringify(p) === JSON.stringify(STORE)) { sessionStorage.removeItem(PKEY); return; }
    pending = p;
  } catch(e){ try { sessionStorage.removeItem(PKEY); } catch(_){} }
}

/* ---------- toast & copy ---------- */
var tt;
function toast(m, sel){
  var el = $('#toast');
  var host = Array.prototype.slice.call(document.querySelectorAll('dialog[open]')).pop() || document.body;
  if (el.parentNode !== host) host.appendChild(el);
  el.innerHTML = '<span>'+esc(m)+'</span>'+(sel!=null ? '<input readonly id="toastSel" aria-label="'+esc(t('copy'))+'" value="'+esc(sel)+'">' : '');
  el.classList.add('on');
  if (sel!=null){ var i = $('#toastSel'); i.focus(); i.select(); }
  clearTimeout(tt);
  tt = setTimeout(function(){ el.classList.remove('on'); }, sel!=null ? 9000 : 3000);
}
function copy(text, ok){
  var done = function(){ toast(ok || t('copied')); };
  var fail = function(){ toast(t('manual'), text); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  } catch(e){ fail(); }
}

/* ---------- actions ---------- */
function act(name, el){
  switch(name){
    case 'add': openEditor(null); break;
    case 'settings': openSettings(); break;
    case 'terms': openTerms(); break;
    case 'translate': autoTranslate(el.dataset.v, el); break;
    case 'editfrom': $('#pd').close(); openEditor(el.dataset.v); break;
    case 'reset': ui = {q:'',cat:'all',sort:ui.sort,stock:false}; $('#q').value=''; $('#stock').checked=false; renderFilters(); renderGrid(); break;
    case 'gocat': ui.cat = el.dataset.v; $('#pd').close(); renderFilters(); renderGrid(); $('#chips').scrollIntoView({block:'center'}); break;
    case 'clearex':
      var n = state.products.filter(function(p){ return p.example; }).length;
      $('#exWrap').innerHTML = '<span style="font-size:14px">Удалить '+n+' '+plural(n,'пример','примера','примеров')+'?</span> <button type="button" class="btn small danger" data-act="clearex-yes">Удалить</button> <button type="button" class="btn small" data-act="clearex-no">Нет</button>';
      break;
    case 'clearex-yes': state.products = state.products.filter(function(p){ return !p.example; }); markDirty(); renderAll(); toast('Примеры убраны'); break;
    case 'clearex-no': renderOwner(); break;
    case 'del':
      $('#delWrap').innerHTML = '<button type="button" class="btn danger" data-act="del-yes">Да, удалить</button> <button type="button" class="btn" data-act="del-no">Нет</button>';
      break;
    case 'del-no': $('#delWrap').innerHTML = '<button type="button" class="btn danger-ghost" data-act="del">Удалить товар</button>'; break;
    case 'del-yes':
      var id = draft && draft.id;
      state.products = state.products.filter(function(p){ return p.id!==id; });
      draft = null; $('#ed').close(); markDirty(); renderAll(); toast('Товар удалён из черновика');
      break;
    case 'publish': publish(); break;
    case 'svc-add': $('#svcRows').insertAdjacentHTML('beforeend', svcRow()); break;
    case 'svc-del': el.closest('.svc-row').remove(); break;
    case 'discard':
      if (!discardArmed){ discardArmed = true; renderSavebar(); break; }
      state = clone(STORE); dirty = false; discardArmed = false; renderAll(); toast('Правки отменены');
      break;
    case 'restore':
      state = clone(pending); state.rev = STORE.rev; state.updated = STORE.updated;
      pending = null; try { sessionStorage.removeItem(PKEY); } catch(e){}
      markDirty(); renderAll(); toast('Правки восстановлены. Проверьте и опубликуйте');
      break;
    case 'forget': pending = null; try { sessionStorage.removeItem(PKEY); } catch(e){} renderOwner(); break;
  }
}

function bind(){
  document.addEventListener('click', function(e){
    var t0 = e.target, c;
    if (t0.tagName === 'DIALOG' && (t0.id === 'pd' || t0.id === 'td')){ t0.close(); return; }
    if ((c = t0.closest('[data-copyalso]'))){
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.dataset.copyalso).then(function(){ toast(t('msgCopied')); }, function(){}); } catch(_){}
      return;
    }
    if ((c = t0.closest('[data-copy]'))){ e.preventDefault(); copy(c.dataset.copy, c.dataset.ok); return; }
    if ((c = t0.closest('[data-go]'))){ e.preventDefault(); var pd = $('#pd'); if (pd.open) pd.close(); var tgt = document.getElementById(c.dataset.go); if (tgt) tgt.scrollIntoView({block:'start'}); return; }
    if ((c = t0.closest('[data-close]'))){ c.closest('dialog').close(); return; }
    if ((c = t0.closest('[data-lang]'))){ setLang(c.dataset.lang); return; }
    if ((c = t0.closest('[data-cat]'))){ ui.cat = c.dataset.cat; renderFilters(); renderGrid(); return; }
    if ((c = t0.closest('[data-g]'))){
      var p = find($('#pd').dataset.id), i = +c.dataset.g;
      if (p && p.photos[i]){ $('#gmain').innerHTML = '<img src="'+p.photos[i]+'" alt="'+esc(tr(p.title))+'">';
        Array.prototype.forEach.call(document.querySelectorAll('[data-g]'), function(b){ b.setAttribute('aria-current', String(b===c)); }); }
      return;
    }
    if ((c = t0.closest('[data-ph]'))){
      var k = +c.dataset.i;
      if (c.dataset.ph==='del') draft.photos.splice(k,1);
      else if (k>0){ var tmp = draft.photos[k-1]; draft.photos[k-1] = draft.photos[k]; draft.photos[k] = tmp; }
      renderPhotos(); return;
    }
    if ((c = t0.closest('[data-act]'))){ act(c.dataset.act, c); return; }
    if ((c = t0.closest('.card')) && editing){ e.preventDefault(); openEditor(c.dataset.id); return; }
    if (t0.closest('#editToggle')){ editing = !editing; renderAll(); return; }
  });
  document.addEventListener('submit', function(e){
    if (e.target.id==='edForm'){ e.preventDefault(); saveDraft(); }
    else if (e.target.id==='sdForm'){ e.preventDefault(); saveSettings(); }
  });
  document.addEventListener('change', function(e){
    var el = e.target;
    if (el.id==='files'){ addFiles(el.files); el.value=''; }
    else if (el.id==='stock'){ ui.stock = el.checked; renderGrid(); }
    else if (el.id==='sort'){ ui.sort = el.value; renderGrid(); }
  });
  document.addEventListener('input', function(e){ if (e.target.id==='q'){ ui.q = e.target.value; renderGrid(); } });
  document.addEventListener('dragover', function(e){ var d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', function(e){ var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function(e){ var d = e.target.closest && e.target.closest('#drop'); if (d){ e.preventDefault(); d.classList.remove('over'); addFiles(e.dataTransfer.files); } });
  $('#pd').addEventListener('close', function(){ $('#pd').dataset.id = ''; clearHash(); });
  $('#td').addEventListener('close', function(){ if (location.hash==='#terms'){ try { history.replaceState(null,'',location.pathname+location.search); } catch(e){ location.hash=''; } } });
  $('#ed').addEventListener('close', function(){ draft = null; });
  window.addEventListener('hashchange', route);
}

function connect(){
  var c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  Promise.all([c.use('user'), c.use('artifact')]).then(function(r){
    var u = r[0]; art = r[1];
    if (!u || !art) return;
    return u.canEdit().then(function(ok){
      if (!ok) return;
      canEdit = true; loadPending();
      if (pending) editing = true;
      renderAll();
      return c.use('sample').then(function(s){ samp = s || null; }, function(){});
    });
  }).catch(function(){});
}

buildShell(); bind(); renderAll(); route(); connect();
})();
</script>
</body></html>
